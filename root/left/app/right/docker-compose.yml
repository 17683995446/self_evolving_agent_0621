version: "3.8"

services:
  agent:
    image: self-evolving-agent:latest
    build:
      context: ../../..
      dockerfile: root/left/app/right/Dockerfile
    container_name: self_evolving_agent
    environment:
      - AGENT_ENV=prod
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
    volumes:
      - agent_data:/app/data
      - agent_logs:/app/logs
    ports:
      - "8080:8080"
    restart: unless-stopped
    mem_limit: 1024m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  agent_data:
    driver: local
  agent_logs:
    driver: local
